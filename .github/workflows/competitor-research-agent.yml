name: Levora Competitor Research – Täglicher Bericht

on:
  schedule:
    - cron: "0 7 * * *"  # täglich 09:00 CET (07:00 UTC)
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r competitor-research-agent/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run competitor research agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_RESEARCH_FOLDER_ID: ${{ secrets.DRIVE_RESEARCH_FOLDER_ID }}
        run: python competitor-research-agent/agent.py
