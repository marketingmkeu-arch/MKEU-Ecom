name: Levora Rechnungs-Agent

on:
  schedule:
    - cron: "0 18 * * *"  # daily at 20:00 CET (18:00 UTC)
  workflow_dispatch:

jobs:
  run-invoice-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r invoice-agent/requirements.txt

      - name: Run invoice agent
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP: "levora-skin.myshopify.com"
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          DRIVE_FOLDER_ID: "1WbR_p1bKJ5_H2HAGy_dvYfcPj9JTOT_R"
        run: python invoice-agent/invoice_agent.py

      - name: Save processed orders
        run: |
          git config user.email "agent@levora-skin.de"
          git config user.name "Levora Invoice Agent"
          git add invoice-agent/processed_orders.json || true
          git diff --staged --quiet || git commit -m "Update processed orders [skip ci]"
          git push || true
